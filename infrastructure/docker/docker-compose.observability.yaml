name: nomoretears-observability

services:
  seq:
    container_name: nomoretears-seq
    image: datalust/seq:2025.2
    restart: on-failure
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD:-changeme}
    ports:
      - "5341:80"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /api HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ $$status == *200* ]]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - seq-data:/data
    networks:
      - internal

volumes:
  seq-data:

networks:
  internal:
    name: nomoretears-internal-development
    external: true