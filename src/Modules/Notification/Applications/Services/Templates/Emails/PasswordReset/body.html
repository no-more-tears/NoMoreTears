<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2328;">
  <p>Hello,</p>
  <p>We received a request to reset the password for <strong>{{Email}}</strong>.</p>
  <p><a href="{{Link}}" style="display: inline-block; padding: 10px 20px; background: #1f6feb; color: #ffffff; text-decoration: none; border-radius: 6px;">Reset password</a></p>
  <p>If the button does not work, copy this link into your browser:<br>{{Link}}</p>
  <p style="color: #656d76;">The link expires at {{ExpiresAt}}. If you did not request a reset, ignore this email; your password stays unchanged.</p>
</body>
</html>
